<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Survey Result</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 40px;
        }

        .container {
            width: 400px;
            margin: 0 auto;
            background-color: white;
            padding: 25px;
            border: 2px solid black;
        }

        h1 {
            text-align: center;
        }

        p {
            font-size: 18px;
        }

        a {
            display: block;
            margin-top: 20px;
            text-align: center;
            background-color: black;
            color: white;
            padding: 10px;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Submitted Info</h1>

        <p><strong>Name:</strong> {{ name }}</p>
        <p><strong>Dojo Location:</strong> {{ location }}</p>
        <p><strong>Favorite Language:</strong> {{ language }}</p>
        <p><strong>Comment:</strong> {{ comment }}</p>

        <a href="/">Go Back</a>
    </div>

</body>
</html>
