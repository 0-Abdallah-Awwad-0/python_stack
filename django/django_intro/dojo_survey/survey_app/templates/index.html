{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dojo Survey</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

    <main class="container">
        <h1>Dojo Survey</h1>

        <form action="/result/" method="POST">
            {% csrf_token %}

            <label>Your Name:</label>
            <input type="text" name="name" required>

            <label>Dojo Location:</label>
            <select name="location">
                <option value="Ramallah">Ramallah</option>
                <option value="Nablus">Nablus</option>
                <option value="Hebron">Hebron</option>
                <option value="Gaza">Gaza</option>
            </select>

            <label>Favorite Language:</label>
            <select name="language">
                <option value="Python">Python</option>
                <option value="JavaScript">JavaScript</option>
                <option value="Java">Java</option>
                <option value="C#">C#</option>
            </select>

            <p>Experience Level:</p>
            <label class="inline">
                <input type="radio" name="experience" value="Beginner" checked>
                Beginner
            </label>

            <label class="inline">
                <input type="radio" name="experience" value="Intermediate">
                Intermediate
            </label>

            <label class="inline">
                <input type="radio" name="experience" value="Advanced">
                Advanced
            </label>

            <p>Interests:</p>
            <label class="inline">
                <input type="checkbox" name="interests" value="Web Development">
                Web Development
            </label>

            <label class="inline">
                <input type="checkbox" name="interests" value="Databases">
                Databases
            </label>

            <label class="inline">
                <input type="checkbox" name="interests" value="APIs">
                APIs
            </label>

            <label>Comment:</label>
            <textarea name="comment" rows="4"></textarea>

            <button type="submit">Submit</button>
        </form>
    </main>

</body>
</html>
